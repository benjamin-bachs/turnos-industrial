<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilla de turnos</title>
<style>
  :root{
    --paper:#EFEAE0;
    --ink:#2B2A28;
    --ink-soft:#5B5751;
    --rule:#C9C1B2;
    --taken:#B6C4B0;
    --taken-ink:#33452F;
    --free:#FFFFFF;
    --accent:#8A3B2E;
    --accent-ink:#FFF7EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(transparent, transparent 34px, var(--rule) 35px);
    color:var(--ink);
    font-family: 'Courier New', ui-monospace, monospace;
    padding:24px 16px 60px;
  }
  .sheet{
    max-width:760px;
    margin:0 auto;
  }
  header{
    border-bottom:3px double var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .stamp{
    display:inline-block;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid var(--accent);
    padding:2px 8px;
    margin-bottom:10px;
    transform:rotate(-1.5deg);
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 6px;
    letter-spacing:0.5px;
  }
  .sub{
    color:var(--ink-soft);
    font-size:13px;
    margin:0;
  }
  .day-block{
    margin-bottom:26px;
  }
  .day-title{
    font-family: Georgia, serif;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--ink-soft);
    border-bottom:1px solid var(--rule);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .slot{
    border:1px solid var(--ink);
    background:var(--free);
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
    transition:transform .08s ease;
  }
  .slot:hover:not(.full){
    transform:translateX(2px);
    box-shadow:3px 3px 0 var(--rule);
  }
  .slot-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .slot.full{
    background:var(--taken);
    color:var(--taken-ink);
    cursor:default;
  }
  .slot.selected{
    outline:2px solid var(--accent);
    outline-offset:-2px;
  }
  .slot-time{
    font-weight:700;
    font-size:14px;
    min-width:110px;
  }
  .slot-status{
    font-size:12px;
    text-align:right;
    flex:1;
  }
  .slot-tag{
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:2px 6px;
    border:1px solid currentColor;
    margin-left:8px;
  }
  .slot-people{
    list-style:none;
    margin:8px 0 0;
    padding:8px 0 0;
    border-top:1px dashed var(--rule);
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .slot-people li{
    display:flex;
    justify-content:space-between;
    padding:2px 0;
  }
  .cupos{
    font-size:11px;
    letter-spacing:0.5px;
  }
  form.registro{
    border:2px solid var(--ink);
    padding:18px;
    background:var(--free);
    margin-top:24px;
  }
  form.registro h2{
    font-family:Georgia, serif;
    font-size:16px;
    margin:0 0 14px;
  }
  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  input[type=text]{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--rule);
    background:transparent;
    font-family:inherit;
    font-size:14px;
    margin-bottom:14px;
  }
  .radio-row{
    display:flex;
    gap:16px;
    margin-bottom:16px;
  }
  .radio-opt{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    cursor:pointer;
  }
  .selected-summary{
    font-size:13px;
    background:var(--paper);
    border:1px dashed var(--rule);
    padding:8px 10px;
    margin-bottom:14px;
  }
  .selected-summary strong{color:var(--accent);}
  button{
    width:100%;
    padding:12px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    font-family:inherit;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:13px;
    cursor:pointer;
  }
  button:disabled{
    background:var(--rule);
    color:var(--ink-soft);
    cursor:not-allowed;
  }
  .msg{
    margin-top:10px;
    font-size:13px;
    text-align:center;
  }
  .msg.error{color:var(--accent);}
  .msg.ok{color:#33452F;}
  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:30px;
  }
  .refresh-btn{
    background:none;
    border:1px solid var(--ink);
    color:var(--ink);
    width:auto;
    padding:6px 12px;
    font-size:11px;
    float:right;
    margin-top:-4px;
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <span class="stamp">Cobertura de evento</span>
    <button class="refresh-btn" onclick="loadSlots()">Actualizar</button>
    <h1>Planilla de turnos</h1>
    <p class="sub">Elegí un turno con cupo disponible (máx. 5 personas por turno).</p>
  </header>

  <div id="days"></div>

  <form class="registro" id="regForm">
    <h2>Confirmar turno</h2>
    <div class="selected-summary" id="summary">Todavía no elegiste ningún turno.</div>

    <label for="nombre">Nombre y apellido</label>
    <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>

    <label>¿Recibís la Beca Manuel Belgrano?</label>
    <div class="radio-row">
      <label class="radio-opt"><input type="radio" name="beca" value="true" required> Sí</label>
      <label class="radio-opt"><input type="radio" name="beca" value="false" required> No</label>
    </div>

    <button type="submit" id="submitBtn" disabled>Confirmar turno</button>
    <div class="msg" id="msg"></div>
  </form>

  <p class="footer-note">Los datos se guardan de forma compartida: todas las personas que abran este enlace ven el mismo estado de la planilla.</p>
</div>

<script type="module">

import { supabase } from "./supabase.js";
  
const SCHEDULE = [
  { key: 'mie', label: 'Miércoles', slots: [
      { id: 'mie_1', time: '09:00 – 11:00' },
      { id: 'mie_2', time: '11:00 – 13:00' },
      { id: 'mie_3', time: '14:00 – 17:00' },
  ]},
  { key: 'jue', label: 'Jueves', slots: [
      { id: 'jue_1', time: '09:00 – 11:00' },
      { id: 'jue_2', time: '11:00 – 13:00' },
      { id: 'jue_3', time: '14:00 – 17:00' },
  ]},
  { key: 'vie', label: 'Viernes', slots: [
      { id: 'vie_1', time: '09:00 – 11:00' },
      { id: 'vie_2', time: '11:00 – 13:00' },
  ]},
];

const CUPO_MAX = 5;
let bookings = {}; // slot.id -> array de {nombre, beca, timestamp}
let selectedSlot = null;

async function loadSlots(){

  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Cargando planilla…</p>';

  bookings = {};

  try{

    const { data, error } = await supabase
      .from("inscripciones")
      .select("*");

    if(error){
      throw error;
    }


    data.forEach(row => {

      if(!bookings[row.turno]){
        bookings[row.turno] = [];
      }

      bookings[row.turno].push({
        nombre: row.nombre,
        beca: row.beca,
        timestamp: row.created_at
      });

    });


  }catch(e){

    console.error("Error cargando turnos:", e);

  }


  render();
}

function render(){
  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '';
  SCHEDULE.forEach(day => {
    const block = document.createElement('div');
    block.className = 'day-block';
    const title = document.createElement('div');
    title.className = 'day-title';
    title.textContent = day.label;
    block.appendChild(title);

    day.slots.forEach(slot => {
      const people = bookings[slot.id] || [];
      const cuposLibres = CUPO_MAX - people.length;
      const full = cuposLibres <= 0;
      const div = document.createElement('div');
      div.className = 'slot' + (full ? ' full' : '') + (selectedSlot === slot.id ? ' selected' : '');

      const peopleList = people.length
        ? `<ul class="slot-people">${people.map(p =>
            `<li><span>${escapeHtml(p.nombre)}</span><span class="slot-tag">${p.beca ? 'Beca' : 'Sin beca'}</span></li>`
          ).join('')}</ul>`
        : '';

      div.innerHTML = `
        <div class="slot-head">
          <span class="slot-time">${slot.time}</span>
          <span class="slot-status">
            ${full ? 'Cupo completo' : (selectedSlot === slot.id ? 'Seleccionado · ' : '') + `${cuposLibres} cupo${cuposLibres === 1 ? '' : 's'} libre${cuposLibres === 1 ? '' : 's'}`}
          </span>
        </div>
        ${peopleList}
      `;
      if(!full){
        div.addEventListener('click', () => selectSlot(slot, day));
      }
      block.appendChild(div);
    });
    daysEl.appendChild(block);
  });
}

function selectSlot(slot, day){
  selectedSlot = slot.id;
  const people = bookings[slot.id] || [];
  document.getElementById('summary').innerHTML =
    `Turno elegido: <strong>${day.label}, ${slot.time}</strong> (${CUPO_MAX - people.length} cupos libres)`;
  document.getElementById('submitBtn').disabled = false;
  render();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  msg.className = 'msg';

  if(!selectedSlot){
    msg.textContent = 'Elegí un turno primero.';
    msg.classList.add('error');
    return;
  }
  const nombre = document.getElementById('nombre').value.trim();
  const becaEl = document.querySelector('input[name=beca]:checked');
  if(!nombre || !becaEl){
    msg.textContent = 'Completá todos los campos.';
    msg.classList.add('error');
    return;
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Guardando…';

try{

    const { data: existing, error: checkError } = await supabase
      .from("inscripciones")
      .select("*")
      .eq("turno", selectedSlot);


    if(checkError){
      throw checkError;
    }


    if(existing.length >= CUPO_MAX){

      msg.textContent = 'Ese turno se completó justo ahora. Elegí otro.';
      msg.classList.add('error');

      submitBtn.textContent = 'Confirmar turno';

      selectedSlot = null;

      await loadSlots();

      return;
    }


    const { error } = await supabase
      .from("inscripciones")
      .insert([
        {
          turno:selectedSlot,
          nombre:nombre,
          beca: becaEl.value === "true"
        }
      ]);


    if(error){
      throw error;
    }



    msg.textContent = '¡Turno confirmado! Gracias.';
    msg.classList.add('ok');


    document.getElementById('nombre').value='';
    becaEl.checked=false;

    selectedSlot=null;

    document.getElementById('summary').textContent =
      'Todavía no elegiste ningún turno.';


    submitBtn.textContent='Confirmar turno';
    submitBtn.disabled=true;


    await loadSlots();


}catch(err){

    console.error(err);

    msg.textContent='Hubo un error al guardar. Probá de nuevo.';
    msg.classList.add('error');

    submitBtn.textContent='Confirmar turno';
    submitBtn.disabled=false;

}

});

loadSlots();
</script>
</body>
</html>
